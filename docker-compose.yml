x-common-env: &common-env
  DATABASE_URL: postgresql://gen:gen@db:5432/gen
  WEBHOOK_SECRET: ${WEBHOOK_SECRET:-dev-secret}

x-provider: &provider
  build: .
  command: uvicorn providers.app:app --host 0.0.0.0 --port 9000
  healthcheck:
    test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9000/health')"]
    interval: 3s
    timeout: 3s
    retries: 20

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: gen
      POSTGRES_PASSWORD: gen
      POSTGRES_DB: gen
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gen -d gen"]
      interval: 2s
      timeout: 3s
      retries: 30

  migrate:
    build: .
    command: alembic upgrade head
    environment: *common-env
    depends_on:
      db:
        condition: service_healthy

  alpha:
    <<: *provider
    environment:
      <<: *common-env
      PROVIDER_NAME: alpha
    ports:
      - "9001:9000"

  beta:
    <<: *provider
    environment:
      <<: *common-env
      PROVIDER_NAME: beta
    ports:
      - "9002:9000"

  api:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 4
    environment:
      <<: *common-env
      PUBLIC_URL: http://api:8000
      PROVIDERS: alpha=http://alpha:9000,beta=http://beta:9000
      PROVIDER_TIMEOUT: ${PROVIDER_TIMEOUT:-60}
      DISPATCH_TIMEOUT: ${DISPATCH_TIMEOUT:-5}
      WATCHDOG_INTERVAL: ${WATCHDOG_INTERVAL:-2}
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 3s
      timeout: 3s
      retries: 20
    depends_on:
      migrate:
        condition: service_completed_successfully
      alpha:
        condition: service_healthy
      beta:
        condition: service_healthy

  tests:
    build: .
    profiles: ["test"]
    command: pytest -v
    environment:
      <<: *common-env
      API_URL: http://api:8000
      ALPHA_URL: http://alpha:9000
      BETA_URL: http://beta:9000
      PROVIDER_TIMEOUT: ${PROVIDER_TIMEOUT:-60}
    depends_on:
      api:
        condition: service_healthy
